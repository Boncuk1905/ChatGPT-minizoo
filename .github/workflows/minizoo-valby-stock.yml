name: MiniZoo Valby - automatisk hundetoejslager

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: Europe/Copenhagen
    - cron: "23 10,12,14,16,18 * * *"
      timezone: Europe/Copenhagen
  workflow_dispatch:
    inputs:
      mode:
        description: "Fuld kategoriscanning eller kontrol af eksisterende lagervarer"
        required: true
        default: full
        type: choice
        options:
          - full
          - refresh

permissions:
  contents: write

concurrency:
  group: minizoo-valby-stock
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hent repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Afhaengigheder
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Kontroller scraperens parser og stoerrelsesfiltre
        run: python -m unittest discover -s raceopslag -p "test_valby_stock_scan.py" -v
      - name: Vaelg scanning
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.mode }}
        shell: bash
        run: |
          MODE="refresh"
          if [[ "$SCHEDULE" == "17 8 * * *" || "$REQUESTED" == "full" ]]; then MODE="full"; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Kontroller offentligt Valby-lager
        run: python raceopslag/valby_stock_scan.py --mode "${{ steps.mode.outputs.mode }}"
      - name: Gem lagerstatus paa GitHub
        shell: bash
        run: |
          if [[ ! -f raceopslag/valby-lager.json ]]; then
            echo "Scanner produced no snapshot"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raceopslag/valby-lager.json
          if git diff --cached --quiet; then
            echo "No stock change to commit"
            exit 0
          fi
          git commit -m "Automatisk Valby lagerstatus"
          git push
