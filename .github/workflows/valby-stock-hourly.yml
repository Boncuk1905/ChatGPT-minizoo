name: MiniZoo Valby - lager hver time

on:
  schedule:
    # Dansk lokaltid inkl. automatisk sommertid/vintertid.
    # Hverdage: 10.17-18.17 (ingen scanning kl. 19 eller senere).
    - cron: "17 10-18 * * 1-5"
      timezone: "Europe/Copenhagen"
    # Weekend: 09.17-14.17 (ingen scanning kl. 15 eller senere).
    - cron: "17 9-14 * * 0,6"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minizoo-valby-stock-hourly
  cancel-in-progress: false

jobs:
  scan:
    name: Kontroller offentligt Valby-lager
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Hent repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0
      - name: Kontrollér dansk scanningstid
        id: opening_hours
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo("Europe/Copenhagen"))
          allowed = (10 <= now.hour <= 18) if now.weekday() < 5 else (9 <= now.hour <= 14)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("allowed=" + ("true" if allowed else "false") + "\n")
          print(f"Dansk tid: {now:%A %d-%m-%Y kl. %H:%M}; tilladt scanning: {allowed}")
          if not allowed:
              print("Uden for ønsket tidsrum: Ingen scanning eller lagerændring.")
          PY
      - name: Installer Python
        if: steps.opening_hours.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer HTML-parser
        if: steps.opening_hours.outputs.allowed == 'true'
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - name: Scan MiniZoo Hundetøj og Valby-lager
        if: steps.opening_hours.outputs.allowed == 'true'
        run: python raceopslag/valby_hourly_scanner.py
      - name: Kontrollér lagerfiler
        if: steps.opening_hours.outputs.allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Kontrollerer de to JSON-filer efter scanningen..."
          for file in raceopslag/valby-hourly-stock.json raceopslag/valby-product-catalog.json; do
            if [ ! -s "$file" ]; then
              echo "::error title=Mangler lagerfil::$file blev ikke oprettet eller er tom"
              exit 1
            fi
            ls -lh "$file"
          done
          python -m json.tool raceopslag/valby-hourly-stock.json >/dev/null
          python -m json.tool raceopslag/valby-product-catalog.json >/dev/null

      - name: Gem lagerudtræk
        if: steps.opening_hours.outputs.allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Lokal git-status før gemning:"
          git status --short
          git add --force raceopslag/valby-hourly-stock.json raceopslag/valby-product-catalog.json

          if git diff --cached --quiet; then
            echo "Ingen lagerændringer at gemme."
            exit 0
          fi

          git commit -m "Valby lagerstatus: automatisk timekontrol [skip ci]"
          for attempt in 1 2 3 4 5; do
            echo "Henter seneste main og gemmer lagerudtræk (forsøg $attempt/5)..."
            git fetch origin main:refs/remotes/origin/main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error title=Git-konflikt::Kunne ikke automatisk flette lageropdateringen; ingen filer overskrives."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Lagerfil gemt og offentliggjort på GitHub."
              exit 0
            fi
            echo "::warning title=Push fejlede::Forsøger igen med seneste ændringer."
            sleep $((attempt * 3))
          done
          echo "::error title=GitHub skriverettighed mangler?::Kunne ikke gemme til main. Kontrollér Settings > Actions > General > Workflow permissions > Read and write permissions, og eventuel branch protection."
          exit 1

      - name: Gem scanneresultat som backup ved fejl
        if: ${{ always() && steps.opening_hours.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: valby-scanning-${{ github.run_id }}
          path: |
            raceopslag/valby-hourly-stock.json
            raceopslag/valby-product-catalog.json
          if-no-files-found: warn
          retention-days: 7
